<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lista Inteligente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff7a00">

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>📋 Lista Inteligente</h1>
  <button onclick="togglePro()">🚀 Modo Avançado</button>
</header>

<main>

<section id="step1" class="step active">
  <h2>O que você vai fazer?</h2>
  <button onclick="selectSituation('feira')">🛒 Compras do mês</button>
  <button onclick="selectSituation('churrasco')">🔥 Churrasco</button>
  <button onclick="selectSituation('aniversario')">🎉 Aniversário</button>
  <button onclick="selectSituation('familia')">👨‍👩‍👧 Almoço em família</button>
</section>

<section id="step2" class="step">
  <h2>Quantas pessoas?</h2>
  <input type="number" id="people" value="1" min="1">
  <button onclick="nextStep(3)">Continuar</button>
</section>

<section id="step3" class="step">
  <h2>Estilo</h2>
  <button onclick="setStyle('simples')">Simples</button>
  <button onclick="setStyle('completo')">Completo</button>
</section>

<section id="result" class="step"></section>

</main>

<script src="script.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
