<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lista Inteligente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>📋 Lista Inteligente</h1>
  <button id="darkToggle">🌙</button>
</header>

<div class="progress">
  <div id="progressBar"></div>
</div>

<main id="app">

  <!-- STEP 1 -->
  <section class="step active" id="step1">
    <h2>O que você quer fazer?</h2>

    <button onclick="selectSituation('volta_aulas')">🎒 Volta às aulas</button>
    <button onclick="selectSituation('feira')">🛒 Feira</button>
    <button onclick="selectSituation('aniversario')">🎂 Festa de aniversário</button>
    <button onclick="selectSituation('confraternizacao')">🤝 Confraternização</button>
    <button onclick="selectSituation('familia')">🍽️ Almoço em família</button>

    <button class="ghost" onclick="randomPick()">🎯 Tô sem ideia</button>
  </section>

  <!-- STEP 2 -->
  <section class="step" id="step2"></section>

  <!-- STEP 3 -->
  <section class="step" id="step3">
    <h2>Orçamento</h2>
    <button onclick="setBudget(250)">R$ 250</button>
    <button onclick="setBudget(500)">R$ 500</button>
    <button onclick="setBudget(1412)">1 salário mínimo</button>
    <button class="ghost" onclick="toggleEconomy()">💸 Economia extrema</button>
  </section>

  <!-- STEP 4 -->
  <section class="step" id="step4">
    <h2>Estilo</h2>
    <button onclick="setStyle('simples')">Simples</button>
    <button onclick="setStyle('completo')">Completo</button>

    <label class="input">
      Quantidade de pessoas
      <input type="number" min="1" value="5" id="people">
    </label>
  </section>

  <!-- RESULT -->
  <section class="step" id="result"></section>

</main>

<footer>
  <button onclick="goBack()">⬅️ Voltar</button>
  <button onclick="restart()">🔄 Reiniciar</button>
</footer>

<script src="script.js"></script>
</body>
</html>
